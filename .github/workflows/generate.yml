name: instagram-generate
on:
  schedule:
    - cron: "11 6 * * 1"     # every Monday: draft, render and check the week, then open a PR for approval
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q pillow
      - name: Draft and render the week
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/automation/media
        run: python3 automation/generate.py
      - name: Open a pull request for approval (approval is required, nothing posts without a merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "autopilot"; git config user.email "autopilot@users.noreply.github.com"
          git add -A automation
          git diff --cached --quiet && { echo "nothing generated"; exit 0; }
          B="autopilot/week-$(date +%Y%m%d)"
          git checkout -b "$B" && git commit -m "Weekly Instagram drafts for approval"
          git push -u origin "$B"
          gh pr create --title "Approve this week's Boost Oxygen Instagram posts" \
            --body-file automation/REVIEW.md --base main --head "$B"
